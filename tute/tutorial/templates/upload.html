<!DOCTYPE html>
<html>
<head>
    <title>Upload Files</title>
    {% load static %}
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            align-items: center;
            background-color: #F4A261;
            padding: 10px 20px;
            border-bottom: 2px solid #E76F51;
        }
        .header img {
            height: 50px;
            margin-right: 15px;
        }
        .header h1 {
            color: white;
            font-size: 24px;
            margin: 0;
        }
        .container {
            width: 50%;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        h2 {
            color: #E76F51;
            text-align: left;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input[type="file"] {
            margin: 10px 0;
            padding: 8px;
            border: 2px solid #F4A261;
            border-radius: 4px;
        }
        button {
            background-color: #E76F51;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 4px #C05621;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #F4A261;
            box-shadow: 0 6px #C05621;
        }
        button:active {
            background-color: #F4A261;
            box-shadow: 0 2px #C05621;
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="{% static 'images/logo.png' %}" alt="Tute Logo">
        <h1>codingsneha</h1>
    </div>
    <div class="container">
        <h2>Spoken Tutorial Tool</h2>
        <h3>Transcript to Audio Generator</h3>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Upload</button>
        </form>
    </div>
</body>
</html>
